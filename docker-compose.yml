services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siklusjambi_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=siklusjambi
      - DB_USERNAME=siklus
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    networks:
      - siklusjambi_net

  db:
    image: mysql:8.0
    container_name: siklusjambi_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: siklusjambi
      MYSQL_USER: siklus
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - siklusjambi_dbdata:/var/lib/mysql
    networks:
      - siklusjambi_net

  redis:
    image: redis:alpine
    container_name: siklusjambi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - siklusjambi_redisdata:/data
    networks:
      - siklusjambi_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: siklusjambi_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - siklusjambi_net

networks:
  siklusjambi_net:
    driver: bridge

volumes:
  siklusjambi_dbdata:
    driver: local
  siklusjambi_redisdata:
    driver: local
